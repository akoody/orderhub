name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orderhub
          POSTGRES_PASSWORD: orderhub
          POSTGRES_DB: orderhub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orderhub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://orderhub:orderhub@localhost:5432/orderhub
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
      PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
